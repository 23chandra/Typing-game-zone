<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181425" />
      <stop offset="50%" stop-color="#242132" />
      <stop offset="100%" stop-color="#12101a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2b714" />
      <stop offset="50%" stop-color="#f66e0d" />
      <stop offset="100%" stop-color="#f44c7f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e2b714" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Container Box -->
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="#1f1d2b" fill-opacity="0.75" stroke="#3d3a4f" stroke-width="2" filter="url(#shadow)" />

  <!-- Top Badge -->
  <g transform="translate(100, 110)">
    <rect width="360" height="42" rx="21" fill="#2d293f" stroke="#4e486b" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="44" y="27" font-family="'JetBrains Mono', 'Geist Mono', monospace, sans-serif" font-size="14" font-weight="700" fill="#e2b714" letter-spacing="1.5">
      21 FREE 2D TYPING GAMES • SPEED TEST
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="235" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Typing Game Zone
  </text>
  
  <!-- Sub-Headline with Gradient -->
  <text x="100" y="300" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#accent-grad)" letter-spacing="-0.5">
    Play Free 2D Typing Games Online &amp; Master Speed
  </text>

  <!-- Description paragraph -->
  <text x="100" y="365" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">
    Battle zombie hordes, slice neon blades, race spaceships, and conquer typing lessons
  </text>
  <text x="100" y="398" font-family="'Inter', 'Geist', system-ui, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">
    with real-time mechanical switch sound synthesis and 17 custom color themes.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="14" fill="#29253b" stroke="#484260" stroke-width="1" />
    <text x="20" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">🎮 21 Arcade Titles</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="220" height="50" rx="14" fill="#29253b" stroke="#484260" stroke-width="1" />
    <text x="255" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">⌨️ Mechanical Audio</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="220" height="50" rx="14" fill="#29253b" stroke="#484260" stroke-width="1" />
    <text x="490" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">⚡ Live WPM Telemetry</text>

    <!-- Pill 4 -->
    <rect x="705" y="0" width="235" height="50" rx="14" fill="#29253b" stroke="#484260" stroke-width="1" />
    <text x="725" y="31" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2b714">🌐 100% Free to Play</text>
  </g>
</svg>
